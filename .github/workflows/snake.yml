name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"  # Runs every 12 hours
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ayushdixit1-av
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=e94560&color_dots=1a1a2e,16213e,0f3460,533483,e94560
            dist/github-contribution-grid-snake-dark.png?color_snake=e94560&color_dots=1a1a2e,16213e,0f3460,533483,e94560

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
